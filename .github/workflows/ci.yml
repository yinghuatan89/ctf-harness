name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Syntax check
        run: python -m compileall -q ctf_harness
      - name: Unit tests (offline, no API keys)
        run: python -m unittest discover -s tests -v
      - name: Selftest (end-to-end with mock LLMs)
        run: python -m ctf_harness selftest
